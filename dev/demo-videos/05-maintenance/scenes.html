<style>
.terminal { position:absolute; left:165px;top:175px;width:1590px;height:706px; padding:55px 24px 22px; border:2px solid #43475d; border-radius:17px; background:#1e1e2e;color:#cdd6f4; font:23px/1.38 'DejaVu Sans Mono',monospace; box-shadow:0 26px 90px #0007; }
.chrome { position:absolute;left:0;right:0;top:0; height:42px; padding:7px 20px; border-bottom:1px solid #39394d;background:#181825;border-radius:15px 15px 0 0; display:flex;align-items:center;gap:8px; color:#a6adc8; font-size:17px; }
.chrome i { display:block;width:10px;height:10px;border-radius:100%;background:#6c7086; }
.chrome b { margin-left:12px; font-weight:400; }
.chrome small { margin-left:auto; font-size:16px; }
.tui { position:relative;height:100%; }
.bar { display:flex;gap:11px;align-items:center; border-bottom:1px solid #45475a;padding:0 5px 8px; font-size:19px; color:#bac2de; }
.bar .filter,.bar .menu { background:#a6e3a1;color:#11111b;padding:0 4px; }
.bar .menu { background:#b4befe; }
.bar .right { margin-left:auto; }
.box,.dialog,.termview { border:1px solid #62657d;position:relative;padding:17px 15px 12px; }
.legend { position:absolute;top:-15px;left:12px;color:#bac2de;background:#1e1e2e;padding:0 7px;font-size:20px;line-height:26px; }
.box.focus { border-color:#cba6f7; }
.box.focus .legend {color:#cba6f7;}
.results {height:231px;margin-top:13px;overflow:visible;}
.mid {display:grid;grid-template-columns:20% 45% 1fr;gap:11px;margin:20px 0; }
.mid .box { min-height:92px; }
.mid.installed {grid-template-columns:15% 40% 1fr 1fr;}
.info {height:142px;}
.hint {color:#a6adc8;font-size:18px;line-height:1.5;margin-top:10px;}
.line {min-height:32px;overflow-wrap:anywhere;white-space:pre-wrap;}
.line.compact {min-height:16px;}
.head {color:#cba6f7;font-weight:bold;}
.ok {color:#a6e3a1;}
.warn {color:#f9e2af;}
.red {color:#f38ba8;}
.sky {color:#89dceb;}
.muted {color:#a6adc8;}
.sel {background:#323349;color:#cdd6f4;}
.mark {display:inline-block;max-width:100%;}
.shade {position:absolute;inset:0;background:#11111ba8;}
.dialog {position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:1190px;min-height:286px;padding:29px 30px 26px;background:#181825;border:3px double #b4befe;box-shadow:0 18px 55px #08091288;}
.dialog .legend {background:#181825;font-size:23px;color:#b4befe;font-weight:700;}
.dialog .hint {border-top:1px solid #45475a;margin-top:17px;padding-top:11px;}
.dialog.danger {border-color:#f38ba8;} .danger .legend {color:#f38ba8;}
.dialog.menu-pop {left:auto;right:3px;top:32px;transform:none;width:500px;min-height:0;}
.dialog.wide {width:1390px;}
.tabs {margin:4px 0 19px;border-bottom:1px solid #45475a;padding:2px 0 12px;color:#a6adc8;white-space:pre;}
.active {background:#cba6f7;color:#181825;font-weight:bold;padding:1px 6px;}
.pfchips {color:#89dceb;font-size:21px;margin-bottom:6px;}
.split {position:absolute;inset:24px 38px;display:grid;grid-template-columns:30% 1fr;gap:7px;}
.split .box {background:#1e1e2e;border:3px double #b4befe;padding:22px 18px;}
.split .legend {color:#b4befe;}
.split .hint {position:absolute;bottom:14px;right:10px;left:14px;}
.termview {margin:17px 0;height:87%;padding:24px 25px;}
.termview .hint {position:absolute;left:25px;bottom:12px;}
.monoscreen {height:100%;background:#181825;padding:20px 25px;border:1px solid #45475a;}
.piBar {border-bottom:1px solid #585b70;padding:4px 0 13px; color:#bac2de;}
.piHint {position:absolute;bottom:0;left:0;right:0;padding:6px 18px;border:1px solid #6c7086;font-size:18px;color:#bac2de;}
.piTitle {color:#cba6f7;font-weight:bold;}
.dot {color:#cba6f7;letter-spacing:4px;font-size:19px;}


#ev-stage {background:#0d0e16;}

.dialog.wide {width:1650px;} .dialog.menu-pop {width:540px;top:52px;}

.wizbox {height:405px;} .wizbox .line {font-size:24px;min-height:33px;}
.wiz-msg,.wiz-controls,.piHint {font-size:22px;}

.monoscreen>.hint:empty {display:none;}
.ev-scene {background:#0d0e16;} .ev-scene:has(.ev-shade[hidden])::after {content:"";position:absolute;inset:0;background:rgba(0,0,0,.58);pointer-events:none;}
/* A chapter or line change must leave the badge and both baselines in place. */
.ev-continuous .ev-cap-placed {
  display: grid; grid-template-columns: 36px minmax(0, 1fr);
  grid-template-rows: 31px 29px; align-content: center; align-items: center;
  column-gap: 13px; height: 88px; min-height: 88px; padding: 9px 15px;
  font: 500 23px/29px "DejaVu Sans", sans-serif; letter-spacing: -.45px;
  background: #181c29; border: 1px solid #677185; border-radius: 12px;
  box-shadow: 0 4px 16px #080b12aa;
}
.ev-continuous .ev-num {
  grid-column: 1; grid-row: 1 / 3; min-width: 0; margin: 0; padding: 0;
  height: 34px; font: 600 17px/1 "DejaVu Sans Mono", monospace;
  color: #e0e6f3; background: #303849; border-color: #555f74;
}
.ev-continuous .ev-bold {
  grid-column: 2; grid-row: 1; color: #f4f6ff; font-size: 28px;
}
.ev-continuous .ev-rest { grid-column: 2; grid-row: 2; color: #dce3f0; }

/* Only editorial shots have an unnumbered caption. The scene owns their type
   so the picture and its lettering can have separate, frame-seekable ramps. */
.ev-continuous .ev-cap-placed:not(:has(.ev-num)) { display: none; }
.title-scrim, .end-fade { position: absolute; inset: 0; pointer-events: none; }
.title-scrim { z-index: 2; background: linear-gradient(100deg, rgba(1,3,9,.74), rgba(2,4,9,.6)); }
.title-scrim ~ .ev-shade { z-index: 1; }
.title-copy {
  position: absolute; z-index: 3; left: 192px; top: 246px; width: 1552px;
  font: 480 46px/1.38 "DejaVu Sans", sans-serif; color: #e5e8f3;
}
.title-copy h1, .title-copy p { margin: 0; }
.title-copy h1 {
  font: 700 106px/1.12 "DejaVu Sans", sans-serif; letter-spacing: -5px;
  color: #fafaff; margin: 21px 0 26px;
}
.title-copy .eyebrow {
  display: flex; gap: 22px; align-items: center;
  color: #a9e6f4; font: 600 33px/1.25 "DejaVu Sans Mono", monospace; letter-spacing: 2px;
}
.eyebrow::before { content: ""; width: 74px; height: 5px; background: #8bdcf3; }
.open-title { top: 232px; }
.open-title h1 { display: flex; align-items: center; gap: 32px; font-size: 154px; letter-spacing: -9px; }
.open-title h1 img { width: 128px; height: 128px; }
.chapter-title { top: 275px; }
.chapter-title .sweep-clip { width: 388px; height: 5px; margin-top: 38px; overflow: hidden; }
.sweep { height: 100%; background: linear-gradient(90deg, #909de4, #93e3f6); }
.close-title { top: 190px; }
.close-title h1 { font-size: 100px; }
.credits {
  width: fit-content; margin-top: 43px; padding-top: 22px; border-top: 2px solid #586473;

}
.credits small { display: block; color: #a9e6f4; font: 400 34px/1.4 "DejaVu Sans Mono", monospace; }
.title-copy .address { margin-top: 15px; color: #ccd5ec; font: 400 38px/1.4 "DejaVu Sans Mono", monospace; }
.end-fade { z-index: 4; background: #020309; }
