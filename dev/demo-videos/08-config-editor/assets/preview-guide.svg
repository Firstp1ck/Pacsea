<rect x="784" y="0" width="16" height="28" fill="#585b70"/>
<text x="784" y="22" fill="#89b4fa" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">P</text>
<rect x="800" y="0" width="464" height="28" fill="#585b70"/>
<text x="800" y="22" fill="#89b4fa" textLength="464" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">i Scan: Not set up · 0 queued</text>
<text x="16" y="50" fill="#bac2de" textLength="96" lengthAdjust="spacingAndGlyphs" style="white-space:pre">1 Scan</text>
<text x="160" y="50" fill="#bac2de" textLength="160" lengthAdjust="spacingAndGlyphs" style="white-space:pre">2 Progress</text>
<text x="368" y="50" fill="#bac2de" textLength="144" lengthAdjust="spacingAndGlyphs" style="white-space:pre">3 Results</text>
<text x="560" y="50" fill="#bac2de" textLength="128" lengthAdjust="spacingAndGlyphs" style="white-space:pre">4 Status</text>
