<text x="720" y="50" fill="#1e1e2e" textLength="176" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">▸5 Settings</text>
<text x="1696" y="50" fill="#f9e2af" textLength="192" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">○ Not set up</text>
<text x="0" y="78" fill="#cdd6f4" textLength="1888" lengthAdjust="spacingAndGlyphs" style="white-space:pre">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="0" y="106" fill="#89b4fa" textLength="304" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">Setup 1/7 — Welcome</text>
<text x="0" y="134" fill="#74c7ec" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">◆</text>
<text x="32" y="134" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">○</text>
<text x="64" y="134" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">○</text>
<text x="96" y="134" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">○</text>
<text x="128" y="134" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">○</text>
<text x="160" y="134" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">○</text>
<text x="192" y="134" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">○</text>
<text x="0" y="162" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">┌</text>
<text x="16" y="162" fill="#89b4fa" textLength="112" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">Welcome</text>
<text x="128" y="162" fill="#7f849c" textLength="1760" lengthAdjust="spacingAndGlyphs" style="white-space:pre">─────────────────────────────────────────────────────────────────────────────────────────────────────────────┐</text>
<text x="0" y="190" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="16" y="190" fill="#cdd6f4" textLength="1488" lengthAdjust="spacingAndGlyphs" style="white-space:pre">This seven-step wizard configures Pi Scan without editing settings.conf or restarting Pacsea.</text>
<text x="1872" y="190" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="218" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="1872" y="218" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="246" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="16" y="246" fill="#cdd6f4" textLength="1504" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Pi Scan is advisory: it can miss risks and never proves a package or installed bytes are safe.</text>
<text x="1872" y="246" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="274" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="16" y="274" fill="#cdd6f4" textLength="1328" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Selected package recipe/source data is sent to the exact provider route you review.</text>
<text x="1872" y="274" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="302" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="16" y="302" fill="#cdd6f4" textLength="1152" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Setup makes no package execution and discovery makes no paid model call.</text>
<text x="1872" y="302" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="330" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="16" y="330" fill="#cdd6f4" textLength="1520" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Provider credentials remain owned by Pi; Pacsea never asks for, displays, logs, or stores them.</text>
<text x="1872" y="330" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="358" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="1872" y="358" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="386" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="16" y="386" fill="#cdd6f4" textLength="896" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Conservative defaults remain selected until final Apply.</text>
<text x="1872" y="386" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
<text x="0" y="414" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">│</text>
