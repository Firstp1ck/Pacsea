<text x="0" y="806" fill="#7f849c" textLength="1888" lengthAdjust="spacingAndGlyphs" style="white-space:pre">└────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text>
<text x="0" y="834" fill="#a6e3a1" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">✓</text>
<text x="32" y="834" fill="#a6e3a1" textLength="928" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Draft only — no settings, runtime, or consent has changed.</text>
<text x="0" y="862" fill="#cdd6f4" textLength="1888" lengthAdjust="spacingAndGlyphs" style="white-space:pre">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<rect x="0" y="868" width="192" height="28" fill="#74c7ec"/>
<text x="16" y="890" fill="#1e1e2e" textLength="160" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">Esc Cancel</text>
<rect x="208" y="868" width="128" height="28" fill="#89b4fa"/>
<text x="224" y="890" fill="#1e1e2e" textLength="96" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">n Next</text>
<text x="0" y="918" fill="#cdd6f4" textLength="1888" lengthAdjust="spacingAndGlyphs" style="white-space:pre">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="0" y="946" fill="#f9e2af" textLength="1376" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Nothing is saved until you press Apply on the last step. Esc cancels the guided setup.</text>
<text x="0" y="974" fill="#74c7ec" textLength="80" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">Enter</text>
<text x="96" y="974" fill="#cdd6f4" textLength="96" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Select</text>
<text x="208" y="974" fill="#7f849c" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">·</text>
<text x="240" y="974" fill="#74c7ec" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">n</text>
