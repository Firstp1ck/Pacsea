<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1888 980" width="1888" height="980">
<!-- Headless Pacsea terminal capture or a source-file/terminal excerpt. Sample package, repository, key and status data are illustrative. -->
<rect width="1888" height="980" fill="#1e1e2e"/>
<g font-family="DejaVu Sans Mono, monospace" font-size="26.5" xml:space="preserve">
