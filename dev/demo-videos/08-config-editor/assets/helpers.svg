<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1888 980" width="1888" height="980">
<!-- Headless Pacsea terminal capture or a source-file/terminal excerpt. Sample package, repository, key and status data are illustrative. -->
<rect width="1888" height="980" fill="#1e1e2e"/>
<g font-family="DejaVu Sans Mono, monospace" font-size="26.5" xml:space="preserve">
<rect x="0" y="0" width="32" height="28" fill="#313244"/>
<rect x="32" y="0" width="208" height="28" fill="#313244"/>
<text x="32" y="22" fill="#cba6f7" textLength="208" lengthAdjust="spacingAndGlyphs" style="white-space:pre" font-weight="bold">settings.conf</text>
<text x="48" y="162" fill="#a6adc8" textLength="144" lengthAdjust="spacingAndGlyphs" style="white-space:pre"># Mirrors</text>
<text x="48" y="190" fill="#a6adc8" textLength="1440" lengthAdjust="spacingAndGlyphs" style="white-space:pre"># Select one or more countries (comma-separated). Example: "Switzerland, Germany, Austria"</text>
<text x="48" y="218" fill="#89b4fa" textLength="288" lengthAdjust="spacingAndGlyphs" style="white-space:pre">selected_countries</text>
<text x="352" y="218" fill="#bac2de" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">=</text>
<text x="384" y="218" fill="#a6e3a1" textLength="144" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Worldwide</text>
<text x="48" y="246" fill="#a6adc8" textLength="816" lengthAdjust="spacingAndGlyphs" style="white-space:pre"># Number of HTTPS mirrors to consider when updating</text>
<text x="48" y="274" fill="#89b4fa" textLength="192" lengthAdjust="spacingAndGlyphs" style="white-space:pre">mirror_count</text>
<text x="256" y="274" fill="#bac2de" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">=</text>
<text x="288" y="274" fill="#a6e3a1" textLength="32" lengthAdjust="spacingAndGlyphs" style="white-space:pre">20</text>
<text x="48" y="302" fill="#a6adc8" textLength="1376" lengthAdjust="spacingAndGlyphs" style="white-space:pre"># Preferred AUR helper for CLI operations: auto (detect, paru preferred), paru, or yay</text>
<text x="48" y="330" fill="#89b4fa" textLength="160" lengthAdjust="spacingAndGlyphs" style="white-space:pre">aur_helper</text>
<text x="224" y="330" fill="#bac2de" textLength="16" lengthAdjust="spacingAndGlyphs" style="white-space:pre">=</text>
<text x="256" y="330" fill="#a6e3a1" textLength="64" lengthAdjust="spacingAndGlyphs" style="white-space:pre">auto</text>
<rect x="32" y="924" width="208" height="28" fill="#45475a"/>
<text x="32" y="946" fill="#cdd6f4" textLength="208" lengthAdjust="spacingAndGlyphs" style="white-space:pre">settings.conf</text>
</g>
</svg>
